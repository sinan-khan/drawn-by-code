name: render-short

# Put this file at .github/workflows/render-short.yml in your fork.
# Run it from Actions -> render-short -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene file to render"
        default: "sandbox/2026-09-24-saas-promo/scene.js"
      script:
        description: "Voice-over text (leave empty for no voice)"
        default: ""
      voice:
        description: "edge-tts voice"
        default: "en-US-GuyNeural"
      size:
        description: "Render size"
        default: "1080"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          pip install edge-tts

      - name: Render the silent video
        run: node engine/render.mjs "${{ inputs.scene }}" --size "${{ inputs.size }}"

      - name: Find the MP4
        id: find
        run: |
          DIR=$(dirname "${{ inputs.scene }}")
          FILE=$(ls -t "$DIR"/render/*.mp4 | head -1)
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FILE")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "dur=$DUR" >> "$GITHUB_OUTPUT"
          echo "Video: $FILE ($DUR s)"

      - name: Make the voice (free edge-tts)
        env:
          SCRIPT_TEXT: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
        run: |
          if [ -n "$SCRIPT_TEXT" ]; then
            edge-tts --voice "$VOICE" --text "$SCRIPT_TEXT" --write-media voice.mp3
          else
            ffmpeg -v error -f lavfi -i anullsrc=r=44100:cl=stereo -t 1 voice.mp3
          fi

      - name: Make the music (generated, no licence issues)
        run: |
          ffmpeg -v error -y \
            -f lavfi -i "sine=frequency=110" \
            -f lavfi -i "sine=frequency=165" \
            -f lavfi -i "sine=frequency=220" \
            -filter_complex "[0][1][2]amix=inputs=3,lowpass=f=900,tremolo=f=0.25:d=0.5,volume=0.5" \
            -t "${{ steps.find.outputs.dur }}" music.m4a

      - name: Mix and mux
        run: |
          ffmpeg -v error -y \
            -i "${{ steps.find.outputs.file }}" -i voice.mp3 -i music.m4a \
            -filter_complex "[1:a]apad,volume=1.6[v];[2:a]volume=0.22[m];[v][m]amix=inputs=2:duration=longest,loudnorm=I=-14:TP=-1.5[a]" \
            -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k \
            -t "${{ steps.find.outputs.dur }}" final.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: final.mp4
