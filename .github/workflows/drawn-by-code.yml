
name: Drawn By Code Studio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to do"
        required: true
        type: choice
        options:
          - create-project
          - render-animation

      project_name:
        description: "Project name (lowercase letters, numbers and hyphens)"
        required: true
        default: "my-first-animation"
        type: string

      style:
        description: "Animation style"
        required: true
        default: "paper-cutout"
        type: choice
        options:
          - paper-cutout
          - 70s-poster
          - liquid-light
          - kaleidoscope
          - line
          - clay
          - clay3d
          - risograph
          - pixel-art
          - felt3d
          - engraving

      aspect:
        description: "Video format"
        required: true
        default: "16:9"
        type: choice
        options:
          - "16:9"
          - "9:16"
          - "1:1"
          - "4:5"

      duration:
        description: "Duration in seconds"
        required: true
        default: "6"
        type: string

      scene_path:
        description: "Scene file path for rendering"
        required: false
        type: string

      width:
        description: "Render width"
        required: true
        default: "960"
        type: choice
        options:
          - "960"
          - "1280"
          - "1920"

      run_review:
        description: "Run automatic animation review"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  animation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create animation project
        if: inputs.mode == 'create-project'
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          STYLE: ${{ inputs.style }}
          ASPECT: ${{ inputs.aspect }}
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail

          if ! [[ "$PROJECT_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Use lowercase letters, numbers and hyphens only."
            exit 1
          fi

          node engine/new.mjs "$PROJECT_NAME" \
            --style "$STYLE" \
            --aspect "$ASPECT" \
            --duration "$DURATION"

          PROJECT_DIR="sandbox/$(date -u +%F)-$PROJECT_NAME"

          test -f "$PROJECT_DIR/scene.js"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PROJECT_DIR" sandbox/INDEX.md
          git commit -m "Create animation project: $PROJECT_NAME"
          git push

          {
            echo "## Animation project created"
            echo "Scene file: \`$PROJECT_DIR/scene.js\`"
            echo "Edit this file with code generated by Claude AI."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate render path
        if: inputs.mode == 'render-animation'
        env:
          SCENE: ${{ inputs.scene_path }}
        run: |
          set -euo pipefail

          case "$SCENE" in
            sandbox/*/scene.js) ;;
            *) echo "Invalid scene path"; exit 1 ;;
          esac

          test -f "$SCENE"
          echo "SCENE=$SCENE" >> "$GITHUB_ENV"
          echo "SCENE_DIR=$(dirname "$SCENE")" >> "$GITHUB_ENV"

      - name: Install Chromium
        if: inputs.mode == 'render-animation'
        run: npx playwright-core install --with-deps chromium

      - name: Install FFmpeg
        if: inputs.mode == 'render-animation'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Automatic review
        if: inputs.mode == 'render-animation' && inputs.run_review
        run: node engine/review.mjs "$SCENE" --every 1

      - name: Render MP4
        if: inputs.mode == 'render-animation'
        env:
          WIDTH: ${{ inputs.width }}
        run: node engine/render.mjs "$SCENE" --size "$WIDTH"

      - name: Upload animation artifact
        if: inputs.mode == 'render-animation'
        uses: actions/upload-artifact@v4
        with:
          name: animation-preview-${{ github.run_number }}
          path: |
            ${{ env.SCENE_DIR }}/out/
            ${{ env.SCENE_DIR }}/review/
          if-no-files-found: error
          retention-days: 7

      - name: Render summary
        if: inputs.mode == 'render-animation'
        run: |
          echo "## Animation rendered" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the MP4 from the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "No YouTube upload was performed." >> "$GITHUB_STEP_SUMMARY"
